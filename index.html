<script>
/* ===================== STATE ===================== */
const STORAGE_KEY = "medtime.single.v1";

function seedHistoricalLogs(meds, daysBack){
  const logs = [];
  let seed = 42;
  const rand = () => { seed = (seed*9301+49297)%233280; return seed/233280; };
  for(let i=1;i<=daysBack;i++){
    const d = new Date(); d.setDate(d.getDate()-i);
    const dateStr = d.toISOString().slice(0,10);
    meds.forEach(med=>{
      med.slots.forEach(slot=>{
        const status = rand() > 0.12 ? "taken" : "missed";
        logs.push({ id:`${med.id}-${dateStr}-${slot}`, medicationId:med.id, date:dateStr, slot, status, scheduledTime: med.times[slot] });
      });
    });
  }
  return logs;
}

function todaysSeedLogs(meds){
  const today = new Date().toISOString().slice(0,10);
  const logs = [];
  meds.forEach(med=>{
    med.slots.forEach(slot=>{
      logs.push({ id:`${med.id}-${today}-${slot}`, medicationId:med.id, date:today, slot, status:"pending", scheduledTime: med.times[slot] });
    });
  });
  return logs;
}

function defaultState(){
  const medications = [
    { id:"med-amlodipine", name:"แอมโลดิพีน (Amlodipine)", dosage:"1 เม็ด หลังอาหารเช้าทันที", color:"#F59E0B", slots:["morning"], times:{morning:"08:00"}, notes:"ยาลดความดันโลหิต ห้ามหยุดยาเอง" },
    { id:"med-metformin", name:"เมทฟอร์มิน (Metformin)", dosage:"1 เม็ด หลังอาหารกลางวัน", color:"#FFFFFF", slots:["afternoon"], times:{afternoon:"12:30"}, notes:"ยาควบคุมเบาหวาน" },
    { id:"med-atorvastatin", name:"อะทอร์วาสแตติน (Atorvastatin)", dosage:"1 เม็ด หลังอาหารเย็น", color:"#EF4444", slots:["evening"], times:{evening:"18:30"}, notes:"ยาลดไขมันในเลือด" },
    { id:"med-melatonin", name:"เมลาโทนิน (Melatonin)", dosage:"1 เม็ด ก่อนนอน", color:"#6366F1", slots:["bedtime"], times:{bedtime:"21:00"}, notes:"ช่วยให้นอนหลับ" },
  ];
  return {
    patient: { name:"คุณยายสมศรี ใจดี", age:78, address:"บ้านเลขที่ 124/8 หมู่บ้านสุขใจ ซอย 5 ถนนสุขุมวิท เขตคลองเตย กรุงเทพมหานคร 10110", addressNote:"จุดสังเกต: หน้าบ้านมีกระถางต้นโมกสีขาว" },
    medications,
    doseLogs: [...todaysSeedLogs(medications), ...seedHistoricalLogs(medications, 30)],
    contacts: [
      { id:"c-nurse", name:"พยาบาลวันดี สุขใจ", role:"พยาบาลวิชาชีพดูแลประจำบ้าน", relation:"ผู้ดูแลหลัก", phone:"089-123-4567", isPrimary:true, online:true },
      { id:"c-daughter", name:"คุณสมใจ ใจดี", role:"ลูกสาว", relation:"ลูกสาว", phone:"081-987-6543", isPrimary:false, online:true },
      { id:"c-son", name:"คุณเอกพล ใจดี", role:"ลูกชาย", relation:"ลูกชาย", phone:"086-555-4321", isPrimary:false, online:false },
    ],
    advice: [
      { id:"adv-1", date:new Date().toISOString(), from:"พยาบาลวันดี สุขใจ", message:"คุณยายอย่าลืมดื่มน้ำตามเยอะ ๆ หลังทานยาลดความดันเช้านี้ค่ะ ความดันช่วงเช้า 125/80 อยู่ในเกณฑ์ดีมาก", acknowledged:false },
    ],
    alerts: [],
    staff: { name:"วันดี สุขใจ", role:"พยาบาลวิชาชีพ", clinic:"คลินิกสุขสันต์อบอุ่น", phone:"02-123-4567", pin:"1234" },
    onboarded: false,
    patientPin: "1234",
    fontScale: "normal",
    speechRate: 0.9,
    caregiverAuthed: false,
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return defaultState();
    const parsed = JSON.parse(raw);
    const today = new Date().toISOString().slice(0,10);
    const hasToday = parsed.doseLogs && parsed.doseLogs.some(l=>l.date===today);
    if(!hasToday){ parsed.doseLogs = [...(parsed.doseLogs||[]), ...todaysSeedLogs(parsed.medications)]; }
    return Object.assign(defaultState(), parsed);
  }catch(e){ return defaultState(); }
}

let STATE = loadState();
function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }

/* ===================== HELPERS ===================== */
const SLOT_LABELS = {
  morning:{th:"เช้า", icon:"wb_sunny"},
  afternoon:{th:"กลางวัน", icon:"light_mode"},
  evening:{th:"เย็น", icon:"wb_twilight"},
  bedtime:{th:"ก่อนนอน", icon:"bedtime"},
};
const SLOT_ORDER = ["morning","afternoon","evening","bedtime"];

function todayStr(){ return new Date().toISOString().slice(0,10); }
function todaysLogs(){ return STATE.doseLogs.filter(l=>l.date===todayStr()); }
function findMed(id){ return STATE.medications.find(m=>m.id===id); }
function esc(str){ return String(str==null?"":str).replace(/[&<>"']/g, s=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[s])); }
function icon(name, size, filled, extra){ return `<span class="material-symbols-outlined ${filled?'icon-fill':''} ${extra||''}" style="font-size:${size||24}px">${name}</span>`; }

function speak(text, rate){
  if(!('speechSynthesis' in window)){ alert(text); return; }
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "th-TH";
  u.rate = rate || STATE.speechRate || 0.9;
  window.speechSynthesis.speak(u);
}

function navigate(hash){ location.hash = hash; }

function addAlert(type, message){
  STATE.alerts.unshift({ id:"alert-"+Date.now(), type, message, createdAt:new Date().toISOString(), resolved:false });
  save();
}

function timeAgo(iso){
  const min = Math.floor((Date.now()-new Date(iso).getTime())/60000);
  if(min<1) return "เมื่อสักครู่";
  if(min<60) return min+" นาทีที่แล้ว";
  return Math.floor(min/60)+" ชั่วโมงที่แล้ว";
}

/* Auto-flag missed doses (pending doses more than 45 min past schedule) */
function checkMissedDoses(){
  const now = new Date();
  const today = todayStr();
  let changed = false;
  STATE.doseLogs.forEach(log=>{
    if(log.date!==today || log.status!=="pending") return;
    const [h,m] = log.scheduledTime.split(":").map(Number);
    const sched = new Date(); sched.setHours(h,m,0,0);
    if((now-sched)/60000 > 45){ log.status = "missed"; changed = true; }
  });
  if(changed){ save(); }
  return changed;
}
setInterval(()=>{ if(checkMissedDoses()) render(); }, 30000);

/* ===================== SHARED UI PARTIALS ===================== */

      <div class="flex items-center gap-3 min-w-0">

        : `<div class="w-10 h-10 rounded-full bg-primary flex items-center justify-center flex-shrink-0">${icon('health_and_safety',24,true,'text-white')}</div>`}
        <div class="flex flex-col min-w-0">
          <span class="text-xl font-semibold text-primary leading-tight truncate">${esc(title)}</span>
          ${subtitle?`<span class="text-sm text-on-surface-variant truncate">${esc(subtitle)}</span>`:""}
        </div>
      </div>
      <div class="flex items-center gap-1 flex-shrink-0">
        <button onclick="navigate('#/sos')" class="w-14 h-14 rounded-full flex items-center justify-center text-on-surface-variant hover:bg-surface-container relative">
          ${icon('notifications',28)}
          ${unresolved>0?`<span class="absolute top-3 right-3 w-3 h-3 bg-secondary-container rounded-full ring-2 ring-surface"></span>`:""}
        </button>
        <button onclick="navigate('#/settings')" class="w-14 h-14 rounded-full flex items-center justify-center">
          <div class="w-9 h-9 rounded-full bg-primary-container/20 text-primary flex items-center justify-center font-semibold">${esc(STATE.patient.name.slice(-4,-2))}</div>
        </button>
      </div>
    </div>
  </header>`;
}

function patientBottomNav(active){

    {h:"#/home", label:"หน้าหลัก", icon:"medication"},

function shell(active, title, subtitle, showBack, innerHtml){
  return `${patientHeader(title,subtitle,showBack)}

  ${patientBottomNav(active)}`;

function card(innerHtml, accent, extraClass){
  return `<section class="bg-surface-container-lowest rounded-xl p-5 shadow relative overflow-hidden ${extraClass||''}">
    ${accent?`<div class="absolute top-0 left-0 bottom-0 w-2" style="background:${accent}"></div>`:""}
    ${innerHtml}
  </section>`;
}

function statusBadge(status){
  const map = {
    taken:{bg:"bg-tertiary-container/10",text:"text-tertiary",border:"border-tertiary","icon":"check_circle",label:"เรียบร้อย (Taken)"},
    missed:{bg:"bg-error-container",text:"text-on-error-container",border:"border-error","icon":"error",label:"พลาดโดสยา (Missed)"},
    pending:{bg:"bg-secondary-container/10",text:"text-secondary",border:"border-secondary","icon":"schedule",label:"รอถึงเวลา (Pending)"},
    snoozed:{bg:"bg-surface-container",text:"text-on-surface-variant",border:"border-outline-variant","icon":"snooze",label:"เลื่อนแล้ว (Snoozed)"},
  };
  const s = map[status];
  return `<span class="inline-flex items-center gap-1 px-3 py-2 rounded-lg border ${s.bg} ${s.text} ${s.border}">${icon(s.icon,18,true)}${s.label}</span>`;
}

function primaryBtn({label, onclick, href, icon:ic, variant, extra, type, disabled}){
  variant = variant || "primary";
  const variants = {
    primary:"bg-primary text-white",
    secondary:"bg-surface-container text-on-surface shadow-none",
    outline:"bg-surface-container-lowest border-2 border-secondary text-secondary shadow-sm",
    error:"bg-error text-white",
    ghost:"bg-transparent shadow-none text-on-surface-variant",
  };
  const base = `w-full min-h-[56px] rounded-xl flex items-center justify-center gap-2 font-bold shadow ${variants[variant]} ${extra||''} ${disabled?'opacity-50 pointer-events-none':''}`;
  const content = `${ic?icon(ic,26):""}<span>${esc(label)}</span>`;
  if(href) return `<a href="${href}" class="${base}">${content}</a>`;
  return `<button type="${type||'button'}" ${disabled?'disabled':''} onclick="${onclick||''}" class="${base}">${content}</button>`;
}

function voiceBtn(text, extra){
  return `<button onclick='speak(${JSON.stringify(text)})' class="flex items-center gap-1.5 px-3 py-2 bg-primary-container/15 text-primary rounded-full font-semibold text-sm flex-shrink-0 ${extra||''}">${icon('volume_up',22)}อ่านออกเสียง</button>`;
}

/* ===================== ACTIONS ===================== */
function markDose(id, status){
  const log = STATE.doseLogs.find(l=>l.id===id);
  if(!log) return;
  log.status = status;
  if(status==="taken") log.takenAt = new Date().toISOString();
  save(); render();
}
function acknowledgeAdvice(id){
  const a = STATE.advice.find(x=>x.id===id);
  if(a){ a.acknowledged = true; save(); render(); }
}
function resolveAlert(id){
  const a = STATE.alerts.find(x=>x.id===id);
  if(a){ a.resolved = true; save(); render(); }
}

let addMedDraft = { name:"", dosage:"1 เม็ด หลังอาหาร", color:"#F59E0B", slots:["morning"], times:{morning:"08:00",afternoon:"12:30",evening:"18:30",bedtime:"21:00"}, notes:"" };
function resetAddMedDraft(){ addMedDraft = { name:"", dosage:"1 เม็ด หลังอาหาร", color:"#F59E0B", slots:["morning"], times:{morning:"08:00",afternoon:"12:30",evening:"18:30",bedtime:"21:00"}, notes:"" }; }
function toggleDraftSlot(slot){
  const i = addMedDraft.slots.indexOf(slot);
  if(i>=0) addMedDraft.slots.splice(i,1); else addMedDraft.slots.push(slot);
  render();
}
function setDraftColor(c){ addMedDraft.color = c; render(); }
function submitAddMedicine(e){
  e.preventDefault();
  const nameEl = document.getElementById('med-name');
  const dosageEl = document.getElementById('med-dosage');
  const notesEl = document.getElementById('med-notes');
  addMedDraft.name = nameEl.value.trim();
  addMedDraft.dosage = dosageEl.value.trim() || "1 เม็ด";
  addMedDraft.notes = notesEl.value.trim();
  if(!addMedDraft.name){ alert("กรุณากรอกชื่อยาก่อนนะคะ"); return; }
  if(addMedDraft.slots.length===0){ alert("กรุณาเลือกช่วงเวลาอย่างน้อย 1 ช่วง"); return; }
  const id = "med-"+Date.now();
  const times = {}; addMedDraft.slots.forEach(s=>times[s]=addMedDraft.times[s]);
  STATE.medications.push({ id, name:addMedDraft.name, dosage:addMedDraft.dosage, color:addMedDraft.color, slots:[...addMedDraft.slots], times, notes:addMedDraft.notes });
  const today = todayStr();
  addMedDraft.slots.forEach(slot=>{
    STATE.doseLogs.push({ id:`${id}-${today}-${slot}`, medicationId:id, date:today, slot, status:"pending", scheduledTime: times[slot] });
  });
  save(); resetAddMedDraft();
  navigate('#/home');
}

function checkPin(pin){ return pin === STATE.patientPin; }
let pinBuffer = "";
function tapPinKey(k){
  if(k==="back"){ pinBuffer = pinBuffer.slice(0,-1); render(); return; }
  if(pinBuffer.length>=4) return;
  pinBuffer += k;
  render();
  if(pinBuffer.length===4){
    setTimeout(()=>{
      if(checkPin(pinBuffer)){ STATE.onboarded = true; save(); pinBuffer=""; navigate('#/home'); }
      else { document.getElementById('pin-error').textContent = "รหัส PIN ไม่ถูกต้อง ลองอีกครั้งนะคะ (คำใบ้: 1234)"; pinBuffer=""; render(); }
    }, 200);
  }
}
function quickLogin(){ STATE.onboarded = true; save(); navigate('#/home'); }
function logout(){ STATE.onboarded = false; save(); navigate('#/onboarding'); }

function requestPinHelp(){
  addAlert("pin_reset_request", `${STATE.patient.name} ขอความช่วยเหลือให้ลูกหลานช่วยตั้งรหัส PIN ใหม่`);
  render();
}

function sendLocation(){
  addAlert("location", `${STATE.patient.name} ส่งพิกัดบ้านฉุกเฉินให้ลูกหลานแล้ว`);
  render();
  setTimeout(render, 4000);
}

/* SOS countdown */
let sosState = { phase:"counting", seconds:5, timer:null };
function resetSos(){ if(sosState.timer) clearTimeout(sosState.timer); sosState = { phase:"counting", seconds:5, timer:null }; }
function sosTick(){
  if(sosState.phase!=="counting") return;
  if(sosState.seconds<=0){
    sosState.phase="dispatched";
    addAlert("sos", `${STATE.patient.name} กดปุ่ม SOS ขอความช่วยเหลือฉุกเฉิน`);
    render();
    return;
  }
  render();
  sosState.timer = setTimeout(()=>{ sosState.seconds -= 1; sosTick(); }, 1000);
}
function cancelSos(){ if(sosState.timer) clearTimeout(sosState.timer); sosState.phase="cancelled"; render(); }

/* Settings */
function setFontScale(scale){
  STATE.fontScale = scale; save();
  const map = {normal:"100%", large:"115%", xlarge:"130%"};
  document.documentElement.style.fontSize = map[scale];
  render();
}
function setSpeechRate(v){ STATE.speechRate = parseFloat(v); save(); }
function saveProfile(e){
  e.preventDefault();
  STATE.patient.name = document.getElementById('p-name').value.trim() || STATE.patient.name;
  STATE.patient.age = parseInt(document.getElementById('p-age').value,10) || STATE.patient.age;
  STATE.patient.address = document.getElementById('p-address').value.trim();
  STATE.patient.addressNote = document.getElementById('p-note').value.trim();
  save();
  navigate('#/settings');
}

/* Caregiver */
function checkStaffPin(pin){ return pin === STATE.staff.pin; }
function caregiverLoginSubmit(e){
  e.preventDefault();
  const pin = document.getElementById('cg-pin').value;
  if(checkStaffPin(pin)){ STATE.caregiverAuthed = true; save(); navigate('#/caregiver'); }
  else { document.getElementById('cg-error').textContent = "รหัสผ่านไม่ถูกต้อง (คำใบ้: 1234)"; }
}
function caregiverLogout(){ STATE.caregiverAuthed=false; save(); navigate('#/onboarding'); }
function sendBroadcast(){
  const el = document.getElementById('broadcast-text');
  const text = el.value.trim();
  if(!text) return;
  STATE.advice.unshift({ id:"advice-"+Date.now(), date:new Date().toISOString(), from:STATE.staff.name, message:text, acknowledged:false });
  save(); el.value=""; render();
}
let pinResetDraft = "";
function setPinResetDraft(v){ pinResetDraft = v.replace(/\D/g,'').slice(0,4); }
function resetPatientPin(alertId){
  if(pinResetDraft.length!==4){ alert("กรุณากรอกรหัส PIN 4 หลัก"); return; }
  STATE.patientPin = pinResetDraft;
  if(alertId) resolveAlert(alertId);
  alert(`ตั้งรหัส PIN ใหม่ให้ ${STATE.patient.name} เรียบร้อยแล้ว (${pinResetDraft})`);
  pinResetDraft=""; save(); render();
}

/* ===================== VIEWS ===================== */
function viewOnboarding(){
  const pinDots = [1,2,3,4].map(i=>`<div class="w-14 h-14 rounded-xl flex items-center justify-center text-2xl font-bold shadow-sm ${i<=pinBuffer.length?'bg-primary text-white':'bg-surface-container-high text-on-surface'}">${i<=pinBuffer.length?'•':''}</div>`).join("");
  const keys = ["1","2","3","4","5","6","7","8","9","","0","back"];
  const keypad = keys.map(k=>{
    if(k==="") return `<div></div>`;
    const label = k==="back" ? icon('backspace',24) : k;
    return `<button onclick="tapPinKey('${k}')" class="min-h-[56px] rounded-xl bg-surface-container-low hover:bg-surface-container-high text-2xl font-semibold flex items-center justify-center">${label}</button>`;
  }).join("");
  return `
  <div class="min-h-screen flex flex-col">
    <header class="w-full">
      <div class="h-20 px-5 flex items-center justify-between">
        <div class="flex items-center gap-3">
          <div class="w-10 h-10 rounded-xl bg-primary flex items-center justify-center shadow">${icon('health_and_safety',24,true,'text-white')}</div>
          <div class="flex flex-col">
            <span class="text-lg font-semibold leading-tight">MedTime</span>
            <span class="text-xs text-on-surface-variant leading-none">Senior Sign In</span>

function greeting(){
  const h = new Date().getHours();
  if(h<11) return {t:"สวัสดีตอนเช้า", e:"👵"};
  if(h<17) return {t:"สวัสดีตอนบ่าย", e:"🌤️"};
  if(h<20) return {t:"สวัสดีตอนเย็น", e:"🌇"};
  return {t:"ราตรีสวัสดิ์", e:"🌙"};
}

function viewHistory(){
  const map = new Map();
  STATE.doseLogs.forEach(l=>{ const arr = map.get(l.date)||[]; arr.push(l); map.set(l.date,arr); });
  const entries = Array.from(map.entries()).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14);
  const today = todayStr();
  const yesterday = new Date(Date.now()-86400000).toISOString().slice(0,10);
  function dateLabel(d){ if(d===today) return "วันนี้"; if(d===yesterday) return "เมื่อวาน"; return new Date(d).toLocaleDateString('th-TH',{weekday:'long',day:'numeric',month:'short',year:'numeric'}); }

  const body = entries.map(([date, logs])=>{
    const taken = logs.filter(l=>l.status==="taken").length;
    const rows = logs.sort((a,b)=>a.scheduledTime.localeCompare(b.scheduledTime)).map(log=>{
      const med = findMed(log.medicationId);
      return `<div class="flex items-center gap-3 px-5 py-3">
        <div class="w-10 h-10 rounded-full flex-shrink-0 border border-outline-variant" style="background:${med?med.color:'#ccc'}"></div>
        <div class="flex-1 min-w-0">
          <p class="font-semibold truncate">${med?esc(med.name):'ยาที่ถูกลบแล้ว'}</p>
          <p class="text-xs text-on-surface-variant">เวลา ${log.scheduledTime} น.${log.takenAt?` • กินเมื่อ ${new Date(log.takenAt).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'})}`:''}</p>
        </div>
        ${statusBadge(log.status)}
      </div>`;
    }).join(`<div class="border-t border-outline-variant/40"></div>`);
    return `<div class="flex flex-col gap-2">
      <div class="flex items-center justify-between px-1">
        <h2 class="text-lg font-bold">${dateLabel(date)} • ${new Date(date).toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}</h2>
        <span class="text-xs text-on-surface-variant">${taken}/${logs.length} เรียบร้อย</span>
      </div>
      ${card(`<div class="flex flex-col -mx-5">${rows}</div>`)}
    </div>`;
  }).join("");

  return shell("#/history", "ประวัติ", "MedTime", true, `
    <div class="flex items-center justify-between px-1">
      <h1 class="text-2xl font-bold">ประวัติการกินยา</h1>
      ${voiceBtn("นี่คือประวัติการกินยาย้อนหลัง แสดงรายการที่กินแล้วและรายการที่พลาดในแต่ละวัน")}
    </div>
    ${body || `<p class="text-center text-on-surface-variant">ยังไม่มีประวัติการกินยา</p>`}
    <div class="flex items-center gap-3 bg-surface-container-low p-4 rounded-xl mb-4">
      ${icon('info',24,false,'text-primary flex-shrink-0')}
      <p class="text-sm text-on-surface-variant">ผู้ดูแลของคุณสามารถดูประวัติแบบละเอียดพร้อมกราฟสรุปได้ที่ Caregiver Portal</p>
    </div>
  `);
}

function viewSos(){
  const alerts = STATE.alerts.slice(0,5);
  const primary = STATE.contacts.find(c=>c.isPrimary);
  const logs = todaysLogs();
  const taken = logs.filter(l=>l.status==="taken").length;
  let mainSection = "";

  if(sosState.phase==="counting"){
    const circumference = 2*Math.PI*70;
    const progress = (sosState.seconds/5)*circumference;
    mainSection = `
      <div class="w-full bg-error text-white rounded-xl p-5 shadow-lg flex flex-col items-center text-center gap-2">
        <div class="flex items-center justify-center gap-2">${icon('warning',32,true)}<span class="text-lg uppercase tracking-wider font-bold">แจ้งเตือนฉุกเฉิน SOS</span></div>
        <p class="font-semibold max-w-sm">กำลังส่งสัญญาณขอความช่วยเหลือฉุกเฉินไปยังผู้ดูแลและครอบครัวทันที</p>
      </div>
      <div class="w-full flex flex-col items-center justify-center py-8">
        <div class="relative w-48 h-48 flex items-center justify-center">
          <div class="absolute inset-0 rounded-full bg-error-container/60 animate-ping"></div>
          <svg class="w-full h-full transform -rotate-90 relative z-10" viewBox="0 0 160 160">
            <circle cx="80" cy="80" fill="none" r="70" stroke="#e2e7ff" stroke-width="12"></circle>
            <circle cx="80" cy="80" fill="none" r="70" stroke="#ba1a1a" stroke-dasharray="${circumference}" stroke-dashoffset="${circumference-progress}" stroke-linecap="round" stroke-width="12" style="transition:stroke-dashoffset 1s linear"></circle>
          </svg>
          <div class="absolute inset-0 flex flex-col items-center justify-center z-20 pointer-events-none">
            <span class="text-5xl font-bold text-error leading-none">${sosState.seconds}</span>
            <span class="text-sm text-on-surface-variant mt-1 font-semibold">วินาที</span>
          </div>
        </div>
        <p class="text-error font-bold mt-3 text-center">กำลังเชื่อมต่อสัญญาณฉุกเฉินอัตโนมัติ...</p>
      </div>
      <button onclick="cancelSos()" class="w-full min-h-[64px] bg-surface-container-lowest text-error shadow-md rounded-xl p-4 flex items-center justify-center gap-3">
        ${icon('cancel',32)}
        <div class="flex flex-col text-left">
          <span class="text-lg font-bold">ยกเลิกสัญญาณ SOS</span>
          <span class="text-xs text-on-surface-variant font-medium">กดตรงนี้หากสัมผัสโดนโดยไม่ตั้งใจ</span>
        </div>
      </button>`;
  } else if(sosState.phase==="cancelled"){
    mainSection = card(`
      <div class="flex flex-col items-center gap-2 py-4">
        ${icon('check_circle',48,true,'text-tertiary')}
        <p class="text-lg font-bold">ยกเลิกสัญญาณ SOS แล้ว</p>
        <p class="text-sm text-on-surface-variant">ไม่มีการส่งแจ้งเตือนไปยังผู้ดูแล</p>
        <button onclick="navigate('#/home')" class="mt-2 font-semibold text-primary underline">กลับหน้าหลัก</button>
      </div>
    `, null, "!bg-tertiary-container/10 border-2 border-tertiary/30 text-center");
  } else {
    mainSection = card(`
      <div class="flex flex-col items-center gap-2 py-4">
        ${icon('campaign',48,true,'text-error')}
        <p class="text-lg font-bold">ส่งสัญญาณ SOS เรียบร้อยแล้ว</p>
        <p class="text-sm text-on-surface-variant">${primary?esc(primary.name):''} และครอบครัวได้รับการแจ้งเตือนแล้ว</p>
      </div>
    `, null, "!bg-error-container/40 border-2 border-error/30 text-center");
  }

  const alertsHtml = alerts.length ? `<section class="flex flex-col gap-2 mb-4">
    <h2 class="text-xl font-bold px-1">การแจ้งเตือนล่าสุด</h2>
    ${alerts.map(a=>card(`
      <div class="flex items-start gap-3 pl-2">
        ${icon(a.resolved?'check_circle':'notifications_active',22,false,a.resolved?'text-tertiary':'text-secondary')}
        <div class="flex-1 min-w-0"><p class="text-sm">${esc(a.message)}</p><p class="text-xs text-on-surface-variant">${new Date(a.createdAt).toLocaleString('th-TH')}</p></div>
      </div>
    `,null,"!shadow-sm")).join("")}
  </section>` : "";

  return shell(null, "Emergency Alert", "MedTime", false, `
    ${mainSection}
    ${card(`
      <div class="flex items-center justify-between pl-2">
        <div class="flex items-center gap-2 text-primary">${icon('medical_information',26)}<h2 class="text-xl font-bold text-on-surface">ข้อมูลผู้ป่วยที่ระบบส่งออก</h2></div>
        <span class="px-3 py-1 bg-tertiary-container text-white rounded-full text-xs font-bold flex items-center gap-1"><span class="w-2 h-2 rounded-full bg-white animate-pulse"></span>ส่งสด</span>
      </div>
      <div class="flex items-center gap-3 p-3 bg-surface-container-low rounded-xl mt-3 ml-2">
        <div class="w-16 h-16 rounded-xl bg-primary-container/20 flex items-center justify-center flex-shrink-0">${icon('person',32,false,'text-primary')}</div>
        <div class="min-w-0"><h3 class="font-bold truncate">${esc(STATE.patient.name)}</h3><p class="text-sm text-on-surface-variant font-semibold">อายุ ${STATE.patient.age} ปี</p></div>
      </div>
      <div class="grid grid-cols-2 gap-3 mt-3 ml-2">
        <div class="bg-surface-container p-3 rounded-xl flex items-center gap-2">
          <div class="w-12 h-12 rounded-xl bg-tertiary text-white flex items-center justify-center">${icon('task_alt',26,true)}</div>
          <div class="flex flex-col"><span class="text-xs text-on-surface-variant">กินยาวันนี้</span><span class="text-xl font-bold">${taken}/${logs.length}</span></div>
        </div>
        <div class="bg-surface-container p-3 rounded-xl flex items-center gap-2">
          <div class="w-12 h-12 rounded-xl bg-secondary text-white flex items-center justify-center">${icon('home_pin',24)}</div>
          <div class="flex flex-col min-w-0"><span class="text-xs text-on-surface-variant">ที่อยู่</span><span class="text-xs truncate">${esc(STATE.patient.addressNote)}</span></div>
        </div>
      </div>
    `)}
    <a href="tel:1669" class="w-full min-h-[64px] bg-error text-white rounded-xl flex items-center justify-center gap-2 font-bold shadow">${icon('local_hospital',28)}โทรเรียกรถพยาบาล 1669</a>
    ${alertsHtml}
    ${patientBottomNav(null)}
  `);

  if(!STATE.caregiverAuthed){ navigate('#/caregiver/login'); return ""; }
  const logs = todaysLogs();
  const taken = logs.filter(l=>l.status==="taken").length;
  const unresolved = STATE.alerts.filter(a=>!a.resolved);
  const primary = STATE.contacts.find(c=>c.isPrimary);

  const weekly = [];
  for(let i=6;i>=0;i--){
    const d = new Date(); d.setDate(d.getDate()-i);
    const ds = d.toISOString().slice(0,10);
    const dayLogs = STATE.doseLogs.filter(l=>l.date===ds);
    const pct = dayLogs.length ? Math.round(dayLogs.filter(l=>l.status==="taken").length/dayLogs.length*100) : (ds===todayStr()?0:90);
    weekly.push({date:ds, pct});
  }

  const monitorRows = SLOT_ORDER.map(slot=>{
    const slotLogs = logs.filter(l=>l.slot===slot);
    if(slotLogs.length===0) return "";
    const rows = slotLogs.map(log=>{
      const med = findMed(log.medicationId);
      const cls = log.status==="taken"?"text-tertiary bg-tertiary-container/10":log.status==="missed"?"text-error bg-error-container":"text-secondary bg-secondary-container/10";
      const label = log.status==="taken"?"ทานแล้ว":log.status==="missed"?"พลาด":"รอ";
      return `<div class="flex items-center justify-between gap-2">
        <div class="flex items-center gap-2 min-w-0"><span class="w-3 h-3 rounded-full flex-shrink-0 border border-outline-variant" style="background:${med.color}"></span><span class="text-sm truncate">${esc(med.name)} • ${log.scheduledTime} น.</span></div>
        <span class="px-2 py-1 rounded-full text-xs flex-shrink-0 ${cls}">${label}</span>
      </div>`;
    }).join("");
    return `<div class="py-3 border-t border-outline-variant/40 first:border-t-0">
      <div class="flex items-center gap-1.5 text-on-surface-variant mb-2">${icon(SLOT_LABELS[slot].icon,18)}<span class="text-sm font-semibold">${SLOT_LABELS[slot].th}</span></div>
      <div class="flex flex-col gap-2">${rows}</div>
    </div>`;
  }).join("");

  return caregiverShell("ศูนย์ควบคุมและดูแลการรับประทานยา", `ดูแล ${STATE.patient.name}`, "#/caregiver", `
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
      <div class="lg:col-span-2 flex flex-col gap-4">
        ${unresolved.length>0 ? `<div class="bg-error-container/40 border-2 border-error/30 rounded-xl p-4 flex flex-col gap-2">
          <div class="flex items-center gap-2 text-error font-bold">${icon('notifications_active',24,true)}การแจ้งเตือนที่ต้องดำเนินการ (${unresolved.length})</div>
          ${unresolved.map(a=>`<div class="flex items-center justify-between gap-2 bg-surface-container-lowest rounded-lg p-3">
            <div class="min-w-0"><p class="text-sm">${esc(a.message)}</p><p class="text-xs text-on-surface-variant">${timeAgo(a.createdAt)}</p></div>
            <button onclick="resolveAlert('${a.id}')" class="px-3 py-2 rounded-lg bg-tertiary text-white text-xs font-semibold flex items-center gap-1 flex-shrink-0">${icon('check',16)}รับทราบ</button>
          </div>`).join("")}
        </div>` : ""}

        <div class="bg-surface-container-lowest rounded-xl shadow p-5 flex flex-col gap-2">
          <div class="flex items-center justify-between"><h2 class="text-lg font-bold">สถานะการรับประทานยาวันนี้ (Real-time Medication Monitor)</h2><span class="font-bold text-primary">${taken}/${logs.length}</span></div>
          <div class="w-full h-3 bg-surface-container rounded-full overflow-hidden"><div class="h-full bg-tertiary" style="width:${logs.length?taken/logs.length*100:0}%"></div></div>
          <div>${monitorRows}</div>
        </div>

        <div class="bg-surface-container-lowest rounded-xl shadow p-5 flex flex-col gap-2">
          <h3 class="text-lg font-bold">สถิติความสม่ำเสมอในการรับประทานยาประจำสัปดาห์</h3>
          <div class="flex items-end gap-2 h-32">
            ${weekly.map(d=>`<div class="flex-1 flex flex-col items-center gap-1">
              <div class="w-full bg-surface-container rounded-t-lg flex-1 flex items-end overflow-hidden"><div class="w-full bg-primary rounded-t-lg" style="height:${d.pct}%"></div></div>
              <span class="text-xs text-on-surface-variant">${new Date(d.date).toLocaleDateString('th-TH',{weekday:'short'})}</span>
            </div>`).join("")}
          </div>
        </div>
      </div>

      <div class="flex flex-col gap-4">
        <div class="bg-surface-container-lowest rounded-xl shadow p-5 flex flex-col gap-2">
          <h3 class="text-lg font-bold">ผู้ป่วยที่ดูแลใกล้ชิด</h3>
          <div class="flex items-center gap-3 p-3 bg-surface-container-low rounded-xl">
            <div class="w-14 h-14 rounded-full bg-primary-container/20 flex items-center justify-center flex-shrink-0">${icon('person',28,false,'text-primary')}</div>
            <div class="min-w-0"><p class="font-semibold truncate">${esc(STATE.patient.name)}</p><p class="text-xs text-on-surface-variant">อายุ ${STATE.patient.age} ปี</p></div>
          </div>
          <a href="tel:${primary?primary.phone.replace(/-/g,''):''}" class="min-h-[48px] rounded-lg bg-primary text-white font-semibold flex items-center justify-center gap-1.5">${icon('call',18)}โทรหาผู้ป่วย</a>
          <button onclick="navigate('#/caregiver/report')" class="min-h-[48px] rounded-lg bg-surface-container font-semibold flex items-center justify-center gap-1.5">${icon('description',18)}ดูรายงาน 31 วัน</button>
        </div>

        <div class="bg-surface-container-lowest rounded-xl shadow p-5 flex flex-col gap-2">
          <h3 class="text-lg font-bold">บันทึกคำแนะนำ &amp; บรอดแคสต์</h3>
          <textarea id="broadcast-text" placeholder="พิมพ์คำแนะนำถึงผู้ป่วย..." rows="3" class="w-full px-3 py-2 rounded-lg bg-surface-container-low text-sm resize-none focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
          <button onclick="sendBroadcast()" class="min-h-[48px] rounded-lg bg-primary text-white font-semibold flex items-center justify-center gap-1.5">${icon('send',18)}ส่งถึงผู้ป่วย</button>
          <div class="flex flex-col gap-2 mt-1 max-h-52 overflow-y-auto">
            ${STATE.advice.slice(0,5).map(a=>`<div class="p-3 bg-surface-container-low rounded-lg"><p class="text-sm">${esc(a.message)}</p><p class="text-xs text-on-surface-variant mt-1">${a.acknowledged?'ผู้ป่วยรับทราบแล้ว ✓':'รอผู้ป่วยรับทราบ'}</p></div>`).join("")}
          </div>
        </div>

        <div class="bg-surface-container-lowest rounded-xl shadow p-5 flex flex-col gap-2">
          <h3 class="text-lg font-bold">รีเซ็ตรหัส PIN ให้ผู้ป่วย</h3>
          <div class="flex gap-2">
            <input oninput="setPinResetDraft(this.value)" placeholder="รหัส PIN 4 หลักใหม่" inputmode="numeric" class="flex-1 min-h-[48px] px-3 rounded-lg bg-surface-container-low tracking-widest focus:outline-none focus:ring-2 focus:ring-primary">
            <button onclick="resetPatientPin()" class="min-h-[48px] px-4 rounded-lg bg-tertiary text-white font-semibold flex items-center gap-1.5">${icon('check',18)}ตั้งรหัส</button>
          </div>
        </div>
      </div>
    </div>
  `);
}

function viewCaregiverReport(){
  if(!STATE.caregiverAuthed){ navigate('#/caregiver/login'); return ""; }
  const last31 = [];
  for(let i=30;i>=0;i--){ const d = new Date(); d.setDate(d.getDate()-i); const ds = d.toISOString().slice(0,10); last31.push({date:ds, logs:STATE.doseLogs.filter(l=>l.date===ds)}); }
  const totalTaken = last31.reduce((s,d)=>s+d.logs.filter(l=>l.status==="taken").length,0);
  const totalLogs = last31.reduce((s,d)=>s+d.logs.length,0);
  const overallPct = totalLogs ? Math.round(totalTaken/totalLogs*100) : 0;

  function dayColor(pct){ if(pct===null) return "bg-surface-container"; if(pct===100) return "bg-tertiary"; if(pct>=50) return "bg-secondary-container"; return "bg-error-container"; }
  const grid = last31.map(d=>{
    const taken = d.logs.filter(l=>l.status==="taken").length;
    const pct = d.logs.length ? Math.round(taken/d.logs.length*100) : null;
    return `<div title="${d.date}: ${taken}/${d.logs.length}" class="aspect-square rounded-md flex items-center justify-center text-xs ${dayColor(pct)}">${new Date(d.date).getDate()}</div>`;
  }).join("");

  const perMed = STATE.medications.map(med=>{
    const logs = STATE.doseLogs.filter(l=>l.medicationId===med.id);
    const taken = logs.filter(l=>l.status==="taken").length;
    const missed = logs.filter(l=>l.status==="missed").length;
    return `<tr class="border-b border-outline-variant/20 text-sm">
      <td class="py-2 pr-2 flex items-center gap-2"><span class="w-3 h-3 rounded-full border border-outline-variant flex-shrink-0" style="background:${med.color}"></span>${esc(med.name)}</td>
      <td class="py-2 pr-2 text-on-surface-variant">${esc(med.dosage)}</td>
      <td class="py-2 pr-2 text-right text-tertiary">${taken}</td>
      <td class="py-2 pr-2 text-right text-error">${missed}</td>
      <td class="py-2 text-right font-bold">${logs.length?Math.round(taken/logs.length*100):0}%</td>
    </tr>`;
  }).join("");

  return caregiverShell(STATE.patient.name, "บันทึกการรับประทานยา 31 วัน", "#/caregiver/report", `
    <div class="flex justify-end mb-3 no-print">
      <button onclick="window.print()" class="min-h-[48px] px-4 rounded-lg bg-primary text-white font-semibold flex items-center gap-1.5">${icon('picture_as_pdf',20)}ดาวน์โหลดเป็น PDF / พิมพ์</button>
    </div>
    <div class="flex flex-col gap-4">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
        <div class="bg-surface-container-lowest rounded-xl shadow p-3 flex flex-col items-center"><span class="text-2xl font-bold text-primary">${overallPct}%</span><span class="text-xs text-on-surface-variant text-center">ความสม่ำเสมอรวม 31 วัน</span></div>
        <div class="bg-surface-container-lowest rounded-xl shadow p-3 flex flex-col items-center"><span class="text-2xl font-bold text-tertiary">${totalTaken}</span><span class="text-xs text-on-surface-variant text-center">ครั้งที่ทานตรงเวลา</span></div>
        <div class="bg-surface-container-lowest rounded-xl shadow p-3 flex flex-col items-center"><span class="text-2xl font-bold text-error">${totalLogs-totalTaken}</span><span class="text-xs text-on-surface-variant text-center">ครั้งที่พลาด</span></div>
        <div class="bg-surface-container-lowest rounded-xl shadow p-3 flex flex-col items-center"><span class="text-2xl font-bold">${STATE.medications.length}</span><span class="text-xs text-on-surface-variant text-center">รายการยาที่ติดตาม</span></div>
      </div>
      <div class="bg-surface-container-lowest rounded-xl shadow p-5">
        <h2 class="text-lg font-bold mb-3">บันทึกการรับประทานยา 31 วัน</h2>
        <div class="grid grid-cols-7 gap-1.5">${grid}</div>
        <div class="flex items-center gap-4 mt-3 text-xs text-on-surface-variant">
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-tertiary inline-block"></span>ครบทุกโดส</span>
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-secondary-container inline-block"></span>พลาดบางส่วน</span>
          <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-error-container inline-block"></span>พลาดส่วนใหญ่</span>
        </div>
      </div>
      <div class="bg-surface-container-lowest rounded-xl shadow p-5 overflow-x-auto">
        <h2 class="text-lg font-bold mb-3">ตารางรายการยาประจำตัวและสถิติการรับประทาน</h2>
        <table class="w-full text-left">
          <thead><tr class="text-xs text-on-surface-variant border-b border-outline-variant/40"><th class="py-2 pr-2">ชื่อยา</th><th class="py-2 pr-2">วิธีใช้</th><th class="py-2 pr-2 text-right">ทานแล้ว</th><th class="py-2 pr-2 text-right">พลาด</th><th class="py-2 text-right">% สม่ำเสมอ</th></tr></thead>
          <tbody>${perMed}</tbody>
        </table>
      </div>
    </div>
  `);
}

/* ===================== ROUTER ===================== */
function render(){
  document.documentElement.style.fontSize = {normal:"100%",large:"115%",xlarge:"130%"}[STATE.fontScale] || "100%";
  let hash = location.hash || "#/onboarding";
  if(!STATE.onboarded && !hash.startsWith("#/caregiver") && hash!=="#/onboarding"){
    location.hash = "#/onboarding"; return;
  }
  checkMissedDoses();
  let html = "";
  switch(true){
    case hash==="#/onboarding": html = viewOnboarding(); break;
    case hash==="#/home" || hash==="#/" || hash==="": html = viewHome(); break;
    case hash==="#/add": html = viewAddMedicine(); break;
    case hash==="#/history": html = viewHistory(); break;
    case hash==="#/contacts": html = viewContacts(); break;
    case hash==="#/missed": html = viewMissed(); break;
    case hash==="#/sos":
      html = viewSos();
      if(sosState.phase==="counting" && sosState.seconds===5 && !sosState.timer){ sosState.timer = setTimeout(()=>{ sosState.seconds -= 1; sosTick(); }, 1000); }
      break;
    case hash==="#/settings": html = viewSettings(); break;
    case hash==="#/profile": html = viewProfile(); break;
    case hash==="#/caregiver/login": html = viewCaregiverLogin(); break;
    case hash==="#/caregiver": html = viewCaregiverDashboard(); break;
    case hash==="#/caregiver/report": html = viewCaregiverReport(); break;
    default: html = viewHome();
  }
  if(html) document.getElementById("app").innerHTML = html;
}

window.addEventListener("hashchange", ()=>{ resetSos(); render(); });
window.addEventListener("load", ()=>{
  if(!location.hash) location.hash = STATE.onboarded ? "#/home" : "#/onboarding";
  render();
});
</script>
</body>
</html>
